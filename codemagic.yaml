workflows:
  android-workflow:
    name: Build Kivy APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          brew install autoconf automake libtool pkg-config lld
          
      - name: Build with Buildozer
        script: |
          # 1. 创建纯净虚拟环境，隔离系统 Python
          python3 -m venv venv
          source venv/bin/activate
          pip install buildozer cython
          
          export PATH=$PATH:~/.local/bin
          
          # 2. 终极防爆：强制每次只编译 1 个文件，绝不爆内存
          export MAKEFLAGS="-j1"
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx1024m -Dorg.gradle.daemon=false"
          
          # 3. 清理以前失败的残骸，防止带病编译
          rm -rf .buildozer
          
          # 4. 开始打包（去掉 -v，减少日志输出，防止网页卡死）
          yes | buildozer android debug
    artifacts:
      - bin/*.apk

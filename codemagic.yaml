workflows:
  android-workflow:
    name: Build Kivy APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          brew install autoconf automake libtool pkg-config lld
          pip3 install --user buildozer cython
          
      - name: Clean and Build with Buildozer
        script: |
          export PATH=$PATH:~/.local/bin
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"
          
          # 清理缓存，这是解决该问题的关键步骤
          buildozer clean
          
          # 使用 --force 参数强制重新编译
          yes | buildozer android debug --force
    artifacts:
      - bin/*.apk

workflows:
  android-workflow:
    name: Build Kivy APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          brew install autoconf automake libtool pkg-config lld
          # 强制安装并使用 Python 3.10 避免 p4a 崩溃
          pyenv install 3.10.10 || true
          pyenv global 3.10.10
          pip install --user buildozer cython
          
      - name: Build with Buildozer
        script: |
          export PATH=$PATH:~/.local/bin
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"
          # 清理之前失败的缓存
          buildozer clean
          yes | buildozer android debug
    artifacts:
      - bin/*.apk

workflows:
  android-workflow:
    name: Build Kivy APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          # 安装 Mac 上必需的底层编译工具
          brew install autoconf automake libtool pkg-config lld
          
      - name: Build with Buildozer
        script: |
          # 使用虚拟环境隔离，不管机器自带什么版本都不影响
          python3 -m venv venv
          source venv/bin/activate
          pip install buildozer cython
          
          export PATH=$PATH:~/.local/bin
          
          # 强行限制并发数为 1，彻底防爆内存
          export MAKEFLAGS="-j1"
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx1024m -Dorg.gradle.daemon=false"
          
          # 清理以前的构建残骸
          rm -rf .buildozer
          
          # 开始打包
          yes | buildozer android debug
    artifacts:
      - bin/*.apk

workflows:
  android-workflow:
    name: Build Full Kivy APK
    max_build_duration: 120
    environment:
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          brew install autoconf automake libtool pkg-config lld cmake ninja
          
      - name: Build with Buildozer
        script: |
          python3 -m venv venv
          source venv/bin/activate
          pip install buildozer cython
          
          export PATH=$PATH:~/.local/bin
          
          # 极限单线程防爆
          export MAKEFLAGS="-j1"
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx1024m -Dorg.gradle.daemon=false"
          
          # 强行指定 NDK 路径（默认下载路径）
          export ANDROIDNDK="$HOME/.buildozer/android/platform/android-ndk-r25b"
          
          rm -rf .buildozer
          yes | buildozer android debug
    artifacts:
      - bin/*.apk

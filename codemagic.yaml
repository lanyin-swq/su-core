workflows:
  android-workflow:
    name: Build Full Kivy APK
    max_build_duration: 120
    environment:
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          # 确保系统有 cmake 和 ninja
          brew install autoconf automake libtool pkg-config lld cmake ninja
          
      - name: Build with Buildozer
        script: |
          python3 -m venv venv
          source venv/bin/activate
          
          # 安装 buildozer 和必要的 python 编译工具
          pip install buildozer cython scikit-build-core cmake
          
          export PATH=$PATH:~/.local/bin
          
          # 单线程防爆内存
          export MAKEFLAGS="-j1"
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx1024m -Dorg.gradle.daemon=false"
          
          # 强制清理旧缓存，防止旧版本的破文件干扰
          rm -rf .buildozer
          yes | buildozer android debug
    artifacts:
      - bin/*.apk

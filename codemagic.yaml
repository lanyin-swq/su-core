workflows:
  android-workflow:
    name: Build Full Kivy APK
    max_build_duration: 120
    environment:
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          brew install autoconf automake libtool pkg-config lld cmake ninja
          
      - name: Build with Buildozer
        script: |
          python3 -m venv venv
          source venv/bin/activate
          pip install buildozer cython scikit-build-core cmake
          
          export PATH=$PATH:~/.local/bin
          export MAKEFLAGS="-j1"
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx1024m -Dorg.gradle.daemon=false"
          
          rm -rf .buildozer
          
          # --prefer-binary 会强制优先下载官方预编译好的 Wheel 包，避免漫长的源码编译
          pip install --prefer-binary llama-cpp-python
          
          yes | buildozer android debug
    artifacts:
      - bin/*.apk

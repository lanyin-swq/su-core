workflows:
  android-workflow:
    name: Build Full Kivy APK
    max_build_duration: 120
    environment:
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          brew install autoconf automake libtool pkg-config lld cmake ninja
          
      - name: Build with Buildozer
        script: |
          python3 -m venv venv
          source venv/bin/activate
          
          # 安装打包工具，全部走清华源
          pip install buildozer cython -i https://pypi.tuna.tsinghua.edu.cn/simple
          
          export PATH=$PATH:~/.local/bin
          
          # 强制单线程，防止内存爆炸
          export MAKEFLAGS="-j1"
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx1024m -Dorg.gradle.daemon=false"
          
          # 强行告诉 C++ 编译器去哪里找 Android NDK（针对 Mac 机器路径）
          export CC="$HOME/.buildozer/android/platform/android-ndk-r25b/toolchains/llvm/prebuilt/darwin-x86_64/bin/clang"
          export CXX="$HOME/.buildozer/android/platform/android-ndk-r25b/toolchains/llvm/prebuilt/darwin-x86_64/bin/clang++"
          
          rm -rf .buildozer
          
          # 开始打包
          yes | buildozer android debug
    artifacts:
      - bin/*.apk
